<!doctype html>
<!-- LOUPE logo directions. Each mark is a 120-unit SVG; shown large, at 32 px and at 16 px (tray). -->
<meta charset="utf-8">
<style>
  body { margin: 0; background: #070708; color: #8b8b91; font: 12px "Cascadia Mono", Consolas, monospace; padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 280px); gap: 16px; }
  .tile { background: #0d0d0f; border: 1px solid #1c1c1f; height: 360px; display: grid; grid-template-rows: 1fr auto auto; }
  .big { display: grid; place-items: center; }
  .small { display: flex; gap: 18px; align-items: center; justify-content: center; padding: 14px 0; border-top: 1px solid #1c1c1f; }
  .name { padding: 10px 14px; border-top: 1px solid #1c1c1f; color: #ececec; }
  .name span { color: #8b8b91; }
</style>
<div class="grid" id="g"></div>
<script>
const FG = '#ececec', CY = '#5fc3d3';
const ring = (cx, cy, r, n, dot, skip = -1) => Array.from({ length: n }, (_, i) => {
  const a = i / n * Math.PI * 2 - Math.PI / 2;
  return i === skip ? '' : `<circle cx="${(cx + r * Math.cos(a)).toFixed(2)}" cy="${(cy + r * Math.sin(a)).toFixed(2)}" r="${dot}" fill="${FG}"/>`;
}).join('');
const MARKS = {
  'A  Lens': `<svg viewBox="0 0 120 120">${ring(60, 60, 44, 24, 2.6)}<circle cx="60" cy="60" r="7" fill="${CY}"/></svg>`,
  'B  Island': `<svg viewBox="0 0 120 120"><path d="M14 34h92v28a16 16 0 0 1-16 16H30a16 16 0 0 1-16-16z" fill="${FG}"/><circle cx="36" cy="56" r="8" fill="${CY}"/></svg>`,
  'C  Reticle': `<svg viewBox="0 0 120 120" fill="none" stroke="${FG}" stroke-width="3"><circle cx="60" cy="60" r="42"/><path d="M60 10v18M60 92v18M10 60h18M92 60h18"/><circle cx="60" cy="60" r="6" fill="${CY}" stroke="none"/></svg>`,
  'D  Wordmark': `<svg viewBox="0 0 240 120"><text x="18" y="74" font-family="Cascadia Mono, Consolas, monospace" font-weight="700" font-size="40" fill="${FG}">L</text>${ring(62, 60, 14, 12, 2.1)}<circle cx="62" cy="60" r="3.2" fill="${CY}"/><text x="81" y="74" font-family="Cascadia Mono, Consolas, monospace" font-weight="700" font-size="40" fill="${FG}">UPE</text></svg>`,
};
const g = document.getElementById('g');
for (const [name, svg] of Object.entries(MARKS)) {
  const wide = name.includes('Wordmark');
  g.insertAdjacentHTML('beforeend', `<div class="tile">
    <div class="big"><div style="width:${wide ? 240 : 170}px">${svg}</div></div>
    <div class="small"><div style="width:${wide ? 64 : 32}px">${svg}</div><div style="width:${wide ? 32 : 16}px">${svg}</div></div>
    <div class="name">${name.replace(/^(\w)\s+/, '$1 <span>')}</span></div></div>`);
}
</script>
