<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Discord keys for Hush</title>
<style>
:root{--tile:#151517;--fg:#ececec;--dim:#a6a6ac;--faint:#939399;--accent:#5fc3d3;--accent-hover:#79d3e0;--accent-ink:#061214;--danger:#9a4a4a;
  --sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101114;color:var(--fg);font:13px/1.4 var(--sans);user-select:none}
h1{font:500 13.5px/1.35 var(--sans);margin:0 0 10px}
ol{margin:0 0 12px;padding-left:18px;color:var(--dim);font-size:12.5px}
a{color:var(--fg)}
label{display:block;font:11px var(--mono);color:var(--faint);margin:8px 0 4px}
input{width:100%;font:16px var(--sans);color:var(--fg);background:var(--tile);border:0;border-radius:9px;padding:10px 12px;min-height:44px;user-select:text}
input:focus{outline:1px solid var(--accent)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
button{font:500 13px var(--sans);border:0;border-radius:999px;padding:0 18px;min-height:44px;cursor:pointer;background:var(--tile);color:var(--fg)}
button.p{background:var(--accent);color:var(--accent-ink)}button.p:hover{background:var(--accent-hover)}
#err{color:#d07a7a;font-size:12.5px;min-height:18px;margin-top:8px}
.fine{font:11px var(--mono);color:var(--faint);margin-top:6px}
</style></head><body>
<form id="f">
<h1>Discord keys for Hush</h1>
<ol>
<li>Open <a href="https://discord.com/developers/applications" id="dev">discord.com/developers</a>, New Application, name it Hush.</li>
<li>OAuth2: add the redirect http://localhost and save.</li>
<li>Copy the Client ID, then Reset Secret and copy the secret.</li>
</ol>
<label for="cid">Client ID</label><input id="cid" inputmode="numeric" autocomplete="off" spellcheck="false" autofocus>
<label for="sec">Client secret</label><input id="sec" type="password" autocomplete="off" spellcheck="false">
<div id="err" role="alert"></div>
<div class="row"><button type="button" id="cx">Cancel</button><button class="p">Save</button></div>
<div class="fine">Saved as your user env vars. Never shown again.</div>
</form>
<script src="hush-keys.js"></script>
</body></html>
